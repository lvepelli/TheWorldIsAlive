# Builds, tests, deploys THE WORLD IS ALIVE to GitHub Pages, then runs a mobile + desktop
# QA pass against the live URL and commits the screenshots/report to docs/qa.
name: Deploy & QA

on:
  push:
    branches: ['claude/wizardly-noether-40ohl8', 'main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build (sub-path for GitHub Pages)
        run: BASE_PATH=/${{ github.event.repository.name }}/ npm run build
      - name: Stamp build id (lets QA wait for the new deploy)
        run: echo "${GITHUB_SHA}" > dist/build-id.txt && touch dist/.nojekyll
      - name: Publish to gh-pages branch (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"

  qa:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages to serve this build
        env:
          DEPLOY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          for i in $(seq 1 60); do
            got=$(curl -fsSL "${DEPLOY_URL}build-id.txt" 2>/dev/null || true)
            if [ "$got" = "${GITHUB_SHA}" ]; then echo "live: $got"; exit 0; fi
            echo "waiting ($i): $got"; sleep 10
          done
          echo "::error::GitHub Pages did not serve build ${GITHUB_SHA} within 10 minutes. If this is the first deploy, enable Pages: Settings → Pages → Source: Deploy from a branch → gh-pages / (root)."
          exit 1
      - name: QA against the deployed site
        env:
          DEPLOY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node tests/e2e/deployed.mjs
      - name: Commit QA report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa
          git diff --cached --quiet || git commit -m "QA: deployed-site report for ${GITHUB_SHA::7} [skip ci]"
          git push
