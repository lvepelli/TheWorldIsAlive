# Builds, tests, deploys THE WORLD IS ALIVE to GitHub Pages, then runs a mobile + desktop
# QA pass against the live URL and commits the screenshots/report to docs/qa.
name: Deploy & QA

on:
  push:
    branches: ['claude/wizardly-noether-40ohl8', 'main']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build (sub-path for GitHub Pages)
        run: BASE_PATH=/${{ github.event.repository.name }}/ npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  qa:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: QA against the deployed site
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.page_url }}
        run: node tests/e2e/deployed.mjs
      - name: Commit QA report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa
          git diff --cached --quiet || git commit -m "QA: deployed-site report for ${GITHUB_SHA::7} [skip ci]"
          git push
